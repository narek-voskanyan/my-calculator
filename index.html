<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calculator</title>

    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <main class="calculator-container">

        <!-- Header -->
        <header class="header">

            <img
                src="images/icon-calculator.png"
                alt="Calculator"
                class="calculator-image"
            >

            <div class="header-text">
                <h1 class="title">Calculator</h1>
                <p class="description">Simple calculations</p>
            </div>

        </header>


        <!-- List of calculators -->
        <div class="calculator-list">

            <!-- Calculator -->
            <section class="calculator">

                <!-- Input fields -->
                <div class="input-fields">

                    <div class="input-field-container">

                        <label class="input-field-label">
                            First number
                        </label>

                        <input
                            class="input-field first-number"
                            type="number"
                            placeholder="Enter first number"
                        >

                    </div>


                    <div class="input-field-container">

                        <label class="input-field-label">
                            Second number
                        </label>

                        <input
                            class="input-field second-number"
                            type="number"
                            placeholder="Enter second number"
                        >

                    </div>

                </div>


                <!-- Math operators -->
                <div class="operator-container">

                    <p class="operation-label">
                        Operation
                    </p>
                    <label class="clear-operator-label">
                        <input
                            type="checkbox"
                            class="clear-operator-checkbox"
                        >
                        Remove operator on clear
                    </label>

                    <div class="operator-buttons">

                        <!-- Addition -->
                        <div class="operator-option">
                            <input
                                type="radio"
                                id="operation-add-1"
                                name="operation-1"
                                value="+"
                                class="operator-radio operation-add"
                            >
                    
                            <label
                                for="operation-add-1"
                                class="operator-button-style"
                            >
                                +
                            </label>
                        </div>
                    
                    
                        <!-- Subtraction -->
                        <div class="operator-option">
                            <input
                                type="radio"
                                id="operation-subtract-1"
                                name="operation-1"
                                value="-"
                                class="operator-radio operation-subtract"
                            >
                    
                            <label
                                for="operation-subtract-1"
                                class="operator-button-style"
                            >
                                −
                            </label>
                        </div>
                    
                    
                        <!-- Multiplication -->
                        <div class="operator-option">
                            <input
                                type="radio"
                                id="operation-multiply-1"
                                name="operation-1"
                                value="*"
                                class="operator-radio operation-multiply"
                            >
                    
                            <label
                                for="operation-multiply-1"
                                class="operator-button-style"
                            >
                                ×
                            </label>
                        </div>
                    
                    
                        <!-- Division -->
                        <div class="operator-option">
                            <input
                                type="radio"
                                id="operation-divide-1"
                                name="operation-1"
                                value="/"
                                class="operator-radio operation-divide"
                            >
                    
                            <label
                                for="operation-divide-1"
                                class="operator-button-style"
                            >
                                ÷
                            </label>
                        </div>
                    
                    </div>

                </div>


                <!-- Calculate button -->
                <button
                    class="calculate-button"
                    type="button"
                >
                    Calculate
                </button>


                <!-- Result -->
                <div
                    class="result-container"
                    aria-live="polite"
                >

                    <p class="result-label">
                        Result
                    </p>

                    <output class="result">—</output>

                </div>


                <!-- Action buttons -->
                <div class="action-buttons">

                    <!-- Clear button -->
                    <button
                        class="clear-button"
                        type="button"
                    >
                        Clear
                    </button>


                    <!-- New Calculator button -->
                    <button
                        class="new-calculator-button"
                        type="button"
                    >
                        New Calculator
                    </button>

                </div>

            </section>

        </div>

    </main>


    <script src="scrips/main.js"></script>

</body>

</html>
