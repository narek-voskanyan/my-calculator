<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calculator</title>

    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <main class="calculator-container">

        <!-- Header -->
        <header class="header">
            <img
                src="images/icon-calculator.png"
                alt="Calculator"
                id="calculator-image"
            >

            <div class="header-text">
                <h1 id="title">Calculator</h1>
                <p id="description">Simple calculations</p>
            </div>
        </header>

        <!-- Calculator -->
        <section class="calculator">

            <!-- Input fields -->
            <div class="input-fields">

                <div class="input-field-container">
                    <label
                        class="input-field-label"
                        for="input-first-number-field"
                    >
                        First number
                    </label>

                    <input
                        class="input-field"
                        type="number"
                        id="input-first-number-field"
                        placeholder="Enter first number"
                    >
                </div>

                <div class="input-field-container">
                    <label
                        class="input-field-label"
                        for="input-second-number-field"
                    >
                        Second number
                    </label>

                    <input
                        class="input-field"
                        type="number"
                        id="input-second-number-field"
                        placeholder="Enter second number"
                    >
                </div>

            </div>

       
            <!-- Math operators -->
            <div class="operator-container">

                <p class="operation-label">Operation</p>

                <div class="operator-buttons">

                    <!-- Addition -->
                    <div class="operator-option">
                        <input
                            type="radio"
                            id="operation-add"
                            name="operation"
                            value="+"
                            class="operator-radio"
                        >
                        <label for="operation-add" class="operator-button-style">
                            +
                        </label>
                    </div>

                    <!-- Subtraction -->
                    <div class="operator-option">
                        <input
                            type="radio"
                            id="operation-subtract"
                            name="operation"
                            value="-"
                            class="operator-radio"
                        >
                        <label for="operation-subtract" class="operator-button-style">
                            −
                        </label>
                    </div>

                    <!-- Multiplication -->
                    <div class="operator-option">
                        <input
                            type="radio"
                            id="operation-multiply"
                            name="operation"
                            value="*"
                            class="operator-radio"
                        >
                        <label for="operation-multiply" class="operator-button-style">
                            ×
                        </label>
                    </div>

                    <!-- Division -->
                    <div class="operator-option">
                        <input
                            type="radio"
                            id="operation-divide"
                            name="operation"
                            value="/"
                            class="operator-radio"
                        >
                        <label for="operation-divide" class="operator-button-style">
                            ÷
                        </label>
                    </div>

                </div>
            </div>

            <!-- Calculate button -->
            <button
                class="calculate-button"
                id="calculate-button"
                type="button"
            >
                Calculate
            </button>

            <!-- Result -->
            <div class="result-container" aria-live="polite">

                <p class="result-label">Result</p>

                <output id="result">—</output>

            </div>

            <!-- Action buttons -->
<div class="action-buttons">

    <!-- Clear button -->
    <button
        class="clear-button"
        id="clear-button"
        type="button"
    >
        Clear
    </button>

    <!-- New Calculator button -->
    <button
        class="new-calculator-button"
        id="new-calculator-button"
        type="button"
    >
        New Calculator
    </button>

</div>

        </section>

    </main>

    <script src="scrips/main.js"></script>

</body>
</html>
